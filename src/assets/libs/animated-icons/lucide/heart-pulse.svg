<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true" focusable="false">
<title>heart-pulse</title>
<style>
.hjai{color:var(--icon-primary,currentColor)}
.hjai-p{stroke:var(--icon-primary,currentColor)}
.hjai-a{stroke:var(--icon-secondary,var(--color-accent,#4FD1C5))}
.hjai{transition:transform .18s ease-out}.hjai-host:hover .hjai{animation:hjai-beat .5s ease-in-out}@keyframes hjai-beat{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}50%{transform:scale(0.98)}}
@media (prefers-reduced-motion: reduce){.hjai,.hjai-host:hover .hjai{transition:none;animation:none}}
</style>
<g class="hjai">
<path class="hjai-p" d="M19 14c1.5-1.5 3-3.3 3-5.5A4.5 4.5 0 0 0 12 5 4.5 4.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7z"/>
<path class="hjai-a" d="M3.2 12H9l1.5-3 3 6 1.5-3h5.8"/>
</g>
</svg>
