<div class="reports-view-layout">
  <header class="tasks-header">
    <div class="header-main">
      <h2>Insights & Trends</h2>
      <div class="header-meta">
         <input type="date" id="report-start-date" title="Start Date" />
         <span>to</span>
         <input type="date" id="report-end-date" title="End Date" />
      </div>
    </div>
    <div class="header-actions">
      <hj-button variant="primary" id="btn-refresh-reports">Refresh</hj-button>
    </div>
  </header>

  <div class="reports-grid">
    <!-- Weekly Summary Card -->
    <div class="report-card full-width">
        <h3>Weekly Review Summary</h3>
        <div id="weekly-summary-content" class="summary-box">
            Loading summary...
        </div>
    </div>

    <!-- Activity Chart -->
    <div class="report-card">
        <h3>Activity Levels (Journals & Words)</h3>
        <div class="chart-container">
            <canvas id="activity-chart"></canvas>
        </div>
    </div>

    <!-- Mood Trend Chart -->
    <div class="report-card">
        <h3>Mood Distribution</h3>
        <div class="chart-container">
            <canvas id="mood-chart"></canvas>
        </div>
    </div>
  </div>
</div>

<style>
  .reports-view-layout {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 20px;
    color: var(--color-text);
  }

  .reports-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  .report-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-panel);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .report-card.full-width {
    grid-column: span 2;
  }

  .report-card h3 {
    font-size: 16px;
    margin: 0;
    color: var(--color-accent);
  }

  .summary-box {
    font-size: 14px;
    line-height: 1.6;
    color: var(--color-text-muted);
    background: rgba(0,0,0,0.1);
    padding: 15px;
    border-radius: var(--radius-panel);
    border-left: 4px solid var(--color-accent);
  }

  .chart-container {
    position: relative;
    height: 300px;
    width: 100%;
  }
</style>
