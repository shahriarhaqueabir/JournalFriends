name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The llama.cpp runtime is not committed; it must be supplied to the
      # build workspace. For CI releases, download a pinned build here.
      - name: Stage llama.cpp runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "llama-b10952-bin-win-cuda-x64")) {
            Write-Host "Runtime folder missing; release builds require it to be staged."
            exit 1
          }

      - name: Build installers
        shell: pwsh
        run: cargo tauri build --bundles msi nsis
        working-directory: src-tauri

      - name: Verify build
        shell: pwsh
        run: .\tools\verify-build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arnold-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
