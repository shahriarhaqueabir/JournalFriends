name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The llama.cpp runtime is not committed (too large). Download the pinned
      # build from the llama.cpp release assets and stage it at the repo root,
      # which is where the Tauri bundler looks for it.
      - name: Stage llama.cpp runtime
        shell: pwsh
        run: |
          $folder = "llama-b10952-bin-win-cuda-x64"
          if (-not (Test-Path $folder)) {
            $zip = "$folder.zip"
            $url = "https://github.com/ggml-org/llama.cpp/releases/download/b10952/llama-b10952-bin-win-cuda-12.4-x64.zip"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
            Expand-Archive -Path $zip -DestinationPath "." -Force
            # The archive extracts to a versioned folder; normalize the name.
            $extracted = Get-ChildItem -Directory -Filter "llama-b10952-bin-win-cuda*" | Select-Object -First 1
            if ($extracted -and $extracted.Name -ne $folder) {
              Rename-Item -Path $extracted.FullName -NewName $folder
            }
            Remove-Item $zip -Force
          }
          if (-not (Test-Path "$folder/llama-server.exe")) {
            Write-Host "Runtime staging failed: llama-server.exe not found."
            exit 1
          }
          Write-Host "Runtime staged: $folder"

      - name: Build installers
        shell: pwsh
        run: cargo tauri build --bundles msi nsis
        working-directory: src-tauri

      - name: Verify build
        shell: pwsh
        run: .\tools\verify-build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arnold-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
