name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      OPENSSL_DIR: C:\Program Files\OpenSSL-Win64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          if (-not (Test-Path "$env:OPENSSL_DIR\lib\libcrypto.lib")) {
            $found = Get-ChildItem "C:\Program Files\OpenSSL*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { "OPENSSL_DIR=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }
      # The llama.cpp runtime is gitignored; stage minimal stubs so tauri_build
      # can resolve the resource paths in tauri.conf.json during quality checks.
      - name: Stage runtime stubs
        shell: pwsh
        working-directory: .
        run: |
          $dir = "llama-b10952-bin-win-cuda-x64"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-Item -ItemType File -Path "$dir\llama-server.exe" -Force | Out-Null
          New-Item -ItemType File -Path "$dir\LICENSE-LLVM-OpenMP" -Force | Out-Null
          New-Item -ItemType File -Path "$dir\stub.dll" -Force | Out-Null
      - name: Check formatting
        run: cargo fmt --check
      - name: Check build
        run: cargo check
      - name: Run tests
        run: cargo test

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src\js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: Run Node harnesses
        shell: pwsh
        run: |
          Get-ChildItem tools\js-checks -Filter *.test.mjs | ForEach-Object { node $_.FullName }

  security:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      OPENSSL_DIR: C:\Program Files\OpenSSL-Win64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl -y --no-progress
      - name: Stage runtime stubs
        shell: pwsh
        working-directory: .
        run: |
          $dir = "llama-b10952-bin-win-cuda-x64"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          New-Item -ItemType File -Path "$dir\llama-server.exe" -Force | Out-Null
          New-Item -ItemType File -Path "$dir\LICENSE-LLVM-OpenMP" -Force | Out-Null
          New-Item -ItemType File -Path "$dir\stub.dll" -Force | Out-Null
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
