name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      # rusqlite's bundled-sqlcipher feature needs OpenSSL for SQLCipher's
      # crypto; the Windows runner does not ship it by default.
      OPENSSL_DIR: C:\Program Files\OpenSSL-Win64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          if (-not (Test-Path "$env:OPENSSL_DIR\lib\libcrypto.lib")) {
            # choco sometimes installs under a versioned folder; fall back to search.
            $found = Get-ChildItem "C:\Program Files\OpenSSL*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { "OPENSSL_DIR=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }
      - name: Check formatting
        run: cargo fmt --check
      - name: Check build
        run: cargo check
      - name: Run tests
        run: cargo test

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src\js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: Run Node harnesses
        shell: pwsh
        run: |
          Get-ChildItem tools\js-checks -Filter *.test.mjs | ForEach-Object { node $_.FullName }

  security:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      OPENSSL_DIR: C:\Program Files\OpenSSL-Win64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl -y --no-progress
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
